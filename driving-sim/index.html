<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driving Simulator</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="loading">
    <div class="loading-bar"><div class="loading-progress"></div></div>
    <div class="loading-text">Initializing renderer...</div>
  </div>
  <div id="fps" class="debug-overlay"></div>
  <div id="debug" class="debug-overlay"></div>
  <div id="hud" class="hud">
    <div class="speedometer">
      <svg viewBox="0 0 200 200" class="speedo-svg">
        <circle class="speedo-bg" cx="100" cy="100" r="90"></circle>
        <circle class="speedo-fg" cx="100" cy="100" r="90" stroke-dasharray="565.48" stroke-dashoffset="565.48"></circle>
        <text class="speedo-value" x="100" y="115" text-anchor="middle">0</text>
        <text class="speedo-unit" x="100" y="145" text-anchor="middle">km/h</text>
      </svg>
      <div class="gear">N</div>
    </div>
    <div class="minimap" id="minimap"></div>
    <div class="drift-score" id="driftScore">Drift: 0</div>
  </div>
  <div id="menu" class="menu hidden">
    <h1>DRIVING SIMULATOR</h1>
    <button id="startBtn">START</button>
    <button id="settingsBtn">SETTINGS</button>
    <div id="credits" class="credits">Assets: Poly Haven, ambientCG, Kenney.nl (CC0/CC-BY)</div>
  </div>
  <div id="settings" class="menu hidden">
    <h2>SETTINGS</h2>
    <label><input type="checkbox" id="settingTAA" checked> Temporal AA</label>
    <label><input type="checkbox" id="settingBloom" checked> Bloom</label>
    <label><input type="checkbox" id="settingDOF" checked> Depth of Field</label>
    <label><input type="checkbox" id="settingMotionBlur" checked> Motion Blur</label>
    <label><input type="checkbox" id="settingSSR" checked> Screen-Space Reflections</label>
    <label><input type="checkbox" id="settingShadows" checked> Cascaded Shadows</label>
    <label><input type="checkbox" id="settingParticles" checked> Particles</label>
    <label>
      Quality: <select id="qualityPreset">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high" selected>High</option>
        <option value="ultra">Ultra</option>
      </select>
    </label>
    <button id="backBtn">BACK</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
